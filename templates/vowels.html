<!DOCTYPE html>
<html>

<head>

    <title>Vowel Counter</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main-container">

    <h1>Vowel Counter</h1>

    <div class="card">

        <form method="POST">

            <input
            type="text"
            name="text"
            placeholder="Enter Sentence"
            required>

            <button type="submit">
                Count
            </button>

        </form>

        <div class="result">
            {{ result }}
        </div>

        <br>

        <a href="/">
            <button>Home</button>
        </a>

    </div>

</div>

</body>

</html>
