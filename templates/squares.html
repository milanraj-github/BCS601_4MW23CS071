<!DOCTYPE html>
<html>

<head>

<title>Squares & Cubes</title>

<style>

body{
    background:#0D0D0D;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:400px;
    background:#1A1A1A;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px #22D3EE;
}

h1{
    color:#22D3EE;
}

input{
    width:90%;
    padding:14px;
    margin:20px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#A855F7;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

.result{
    margin-top:20px;
    color:#22D3EE;
    font-size:22px;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<h1>Squares & Cubes</h1>

<form method="POST">

<input
type="number"
name="number"
placeholder="Enter Number"
required>

<br>

<button type="submit">
Find
</button>

</form>

<div class="result">

{% if square != "" %}

<p>Square = {{ square }}</p>

<p>Cube = {{ cube }}</p>

{% endif %}

</div>

<br>

<a href="/">
<button>Home</button>
</a>

</div>

</body>

</html>
